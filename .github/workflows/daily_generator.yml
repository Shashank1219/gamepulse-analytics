name: GamePulse Daily Event Generator

on:
  schedule:
    - cron: '0 13 * * *'    # 15:00 CEST (UTC+2) daily
  workflow_dispatch:          # allows manual trigger from GitHub UI
    inputs:
      date:
        description: 'Date to generate (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  generate-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install faker pandas pyarrow boto3 python-dotenv

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target_date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "target_date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Run event generator
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          echo "Generating events for date: ${{ steps.date.outputs.target_date }}"
          python3 data_generator/generate_events.py \
            --date ${{ steps.date.outputs.target_date }}

      - name: Verify S3 partition was created
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          python3 -c "
          import boto3, os, sys
          s3 = boto3.client('s3',
              aws_access_key_id=os.getenv('AWS_ACCESS_KEY_ID'),
              aws_secret_access_key=os.getenv('AWS_SECRET_ACCESS_KEY'),
              region_name=os.getenv('AWS_REGION')
          )
          date = '${{ steps.date.outputs.target_date }}'
          prefix = f'events/date={date}/'
          r = s3.list_objects_v2(Bucket='${{ secrets.S3_BUCKET_NAME }}', Prefix=prefix)
          files = r.get('Contents', [])
          if not files:
              print(f'ERROR: No files found in s3://gamepulse-raw/{prefix}')
              sys.exit(1)
          print(f'Partition verified: {len(files)} file(s) in s3://gamepulse-raw/{prefix}')
          size = sum(o['Size'] for o in files)
          print(f'Total size: {size / 1024:.2f} KB')
          "