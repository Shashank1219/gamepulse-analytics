name: GamePulse Daily Pipeline

on:
  schedule:
    - cron: '0 15 * * *'    # 17:00 CEST (UTC+2) daily
  workflow_dispatch:          # allows manual trigger from GitHub UI
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests boto3 dbt-databricks

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target_date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "target_date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Wake Databricks SQL Warehouse
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: |
          python3 -c "
          import requests, time, os, sys, json

          host    = os.getenv('DATABRICKS_HOST')
          token   = os.getenv('DATABRICKS_TOKEN')
          wh_id   = os.getenv('DATABRICKS_WAREHOUSE_ID')
          headers = {'Authorization': f'Bearer {token}'}

          print(f'Waking warehouse: {wh_id}')

          # Start the warehouse
          start_r = requests.post(
              f'{host}/api/2.0/sql/warehouses/{wh_id}/start',
              headers=headers
          )
          print(f'Start response: {start_r.status_code} {start_r.text}')

          # Poll until running
          for attempt in range(20):
              r    = requests.get(
                  f'{host}/api/2.0/sql/warehouses/{wh_id}',
                  headers=headers
              )
              body = r.json()
              print(f'Full response: {json.dumps(body)}')

              # Handle both response structures
              state = (
                  body.get('state') or
                  body.get('status', {}).get('state') or
                  'UNKNOWN'
              )
              print(f'Attempt {attempt + 1}/20: warehouse state = {state}')

              if state == 'RUNNING':
                  print('Warehouse is running. Proceeding.')
                  break
              if attempt == 19:
                  print('ERROR: Warehouse did not start in time.')
                  sys.exit(1)
              time.sleep(15)
          "

      - name: Verify S3 partition exists
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          python3 -c "
          import boto3, os, sys
          s3 = boto3.client('s3',
              aws_access_key_id=os.getenv('AWS_ACCESS_KEY_ID'),
              aws_secret_access_key=os.getenv('AWS_SECRET_ACCESS_KEY'),
              region_name=os.getenv('AWS_REGION')
          )
          date   = '${{ steps.date.outputs.target_date }}'
          prefix = f'events/date={date}/'
          r      = s3.list_objects_v2(Bucket='${{ secrets.S3_BUCKET_NAME }}', Prefix=prefix)
          files  = r.get('Contents', [])
          if not files:
              print(f'ERROR: No partition found for {date}. Generator may have failed.')
              sys.exit(1)
          print(f'S3 partition verified for {date}: {len(files)} file(s)')
          "

      - name: Trigger Databricks ingestion notebook
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 -c "
          import requests, time, os, sys, json

          host    = os.getenv('DATABRICKS_HOST')
          token   = os.getenv('DATABRICKS_TOKEN')
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          date    = '${{ steps.date.outputs.target_date }}'

          payload = {
              'run_name': f'gamepulse_ingest_{date}',
              'notebook_task': {
                  'notebook_path': '/gamepulse/01_ingest_raw',
                  'base_parameters': {
                      'run_date': date,
                      'mode': 'daily'
                  }
              },
              'new_cluster': {
                  'spark_version': '13.3.x-scala2.12',
                  'node_type_id':  'Standard_DS3_v2',
                  'num_workers':   1,
              }
          }

          r = requests.post(
              f'{host}/api/2.1/jobs/runs/submit',
              headers=headers,
              json=payload
          )

          if r.status_code != 200:
              print(f'ERROR: Job submission failed: {r.status_code} {r.text}')
              sys.exit(1)

          run_id = r.json()['run_id']
          print(f'Databricks run submitted. run_id: {run_id}')

          # Poll until complete
          while True:
              status = requests.get(
                  f'{host}/api/2.1/jobs/runs/get?run_id={run_id}',
                  headers=headers
              ).json()
              state      = status['state']
              lifecycle  = state['life_cycle_state']
              print(f'Run state: {lifecycle}')
              if lifecycle in ('TERMINATED', 'SKIPPED', 'INTERNAL_ERROR'):
                  result = state.get('result_state', 'UNKNOWN')
                  if result != 'SUCCESS':
                      print(f'ERROR: Databricks run failed. result: {result}')
                      sys.exit(1)
                  print(f'Databricks run completed successfully.')
                  break
              time.sleep(30)
          "

      - name: Run dbt models
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: |
          cd dbt/gamepulse
          cat > profiles.yml << PROFILE
          gamepulse:
            target: dev
            outputs:
              dev:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST_CLEAN }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: workspace
                schema: gamepulse_dev
                threads: 4
          PROFILE
          dbt run --profiles-dir .

      - name: Run dbt tests
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          cd dbt/gamepulse
          dbt test --profiles-dir .

      - name: Pipeline summary
        if: always()
        run: |
          echo "================================"
          echo "GamePulse Pipeline Summary"
          echo "Date processed : ${{ steps.date.outputs.target_date }}"
          echo "Triggered by   : ${{ github.event_name }}"
          echo "Run ID         : ${{ github.run_id }}"
          echo "================================"