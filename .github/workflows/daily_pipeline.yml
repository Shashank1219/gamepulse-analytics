name: GamePulse Daily Pipeline

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_HOST_CLEAN: ${{ secrets.DATABRICKS_HOST_CLEAN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests boto3 dbt-databricks databricks-sql-connector

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target_date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "target_date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Verify S3 partition exists
        run: |
          python3 -c "
          import boto3, os, sys
          s3 = boto3.client('s3',
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              region_name=os.environ['AWS_REGION']
          )
          date   = '${{ steps.date.outputs.target_date }}'
          prefix = f'events/date={date}/'
          r      = s3.list_objects_v2(Bucket=os.environ['S3_BUCKET_NAME'], Prefix=prefix)
          files  = r.get('Contents', [])
          if not files:
              print(f'ERROR: No partition found for {date}')
              sys.exit(1)
          print(f'S3 partition verified: {len(files)} file(s) for {date}')
          "

      - name: Warm up Databricks warehouse
        run: |
          python3 -c "
          import os
          from databricks import sql

          # Submitting a lightweight query wakes the serverless warehouse
          # automatically without needing the management API
          print('Sending warm-up query to wake serverless warehouse...')
          with sql.connect(
              server_hostname=os.environ['DATABRICKS_HOST_CLEAN'],
              http_path=os.environ['DATABRICKS_HTTP_PATH'],
              access_token=os.environ['DATABRICKS_TOKEN']
          ) as conn:
              with conn.cursor() as cursor:
                  cursor.execute('SELECT 1')
                  result = cursor.fetchone()
                  print(f'Warehouse warm-up successful. Result: {result}')
          "

      - name: Trigger Databricks ingestion notebook
        run: |
          python3 -c "
          import requests, time, os, sys

          host    = os.environ['DATABRICKS_HOST']
          token   = os.environ['DATABRICKS_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          date    = '${{ steps.date.outputs.target_date }}'

          payload = {
              'run_name': f'gamepulse_ingest_{date}',
              'notebook_task': {
                  'notebook_path': '/gamepulse/01_ingest_raw',
                  'base_parameters': {'run_date': date, 'mode': 'daily'}
              },
              'new_cluster': {
                  'spark_version': '13.3.x-scala2.12',
                  'node_type_id':  'Standard_DS3_v2',
                  'num_workers':   1,
              }
          }

          r = requests.post(
              f'{host}/api/2.1/jobs/runs/submit',
              headers=headers, json=payload
          )
          if r.status_code != 200:
              print(f'ERROR: {r.status_code} {r.text}')
              sys.exit(1)

          run_id = r.json()['run_id']
          print(f'Run submitted. run_id: {run_id}')

          while True:
              status    = requests.get(
                  f'{host}/api/2.1/jobs/runs/get?run_id={run_id}',
                  headers=headers
              ).json()
              lifecycle = status['state']['life_cycle_state']
              print(f'Run state: {lifecycle}')
              if lifecycle in ('TERMINATED', 'SKIPPED', 'INTERNAL_ERROR'):
                  result = status['state'].get('result_state', 'UNKNOWN')
                  if result != 'SUCCESS':
                      print(f'ERROR: Run failed. result: {result}')
                      sys.exit(1)
                  print('Databricks run completed successfully.')
                  break
              time.sleep(30)
          "

      - name: Run dbt models
        run: |
          cd dbt/gamepulse
          cat > profiles.yml << PROFILE
          gamepulse:
            target: dev
            outputs:
              dev:
                type: databricks
                host: ${DATABRICKS_HOST_CLEAN}
                http_path: ${DATABRICKS_HTTP_PATH}
                token: ${DATABRICKS_TOKEN}
                catalog: workspace
                schema: gamepulse_dev
                threads: 4
          PROFILE
          dbt run --profiles-dir .

      - name: Run dbt tests
        run: |
          cd dbt/gamepulse
          dbt test --profiles-dir .

      - name: Pipeline summary
        if: always()
        run: |
          echo "================================"
          echo "GamePulse Pipeline Summary"
          echo "Date      : ${{ steps.date.outputs.target_date }}"
          echo "Triggered : ${{ github.event_name }}"
          echo "Run ID    : ${{ github.run_id }}"
          echo "================================"