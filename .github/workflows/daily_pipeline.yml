name: GamePulse Daily Pipeline

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install boto3

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target_date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "target_date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Verify S3 partition exists
        run: |
          python3 -c "
          import boto3, os, sys
          s3 = boto3.client('s3',
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              region_name=os.environ['AWS_REGION']
          )
          date   = '${{ steps.date.outputs.target_date }}'
          prefix = f'events/date={date}/'
          r      = s3.list_objects_v2(Bucket=os.environ['S3_BUCKET_NAME'], Prefix=prefix)
          files  = r.get('Contents', [])
          if not files:
              print(f'ERROR: No partition found for {date}. Generator may have failed.')
              sys.exit(1)
          size = sum(o['Size'] for o in files)
          print(f'S3 partition verified for {date}')
          print(f'Files : {len(files)}')
          print(f'Size  : {size / 1024:.2f} KB')
          print('Next steps run locally via Airflow at 15:00 CEST:')
          print('  1. Databricks ingestion notebook')
          print('  2. dbt run')
          print('  3. dbt test')
          "

      - name: Pipeline summary
        if: always()
        run: |
          echo "================================"
          echo "GamePulse Pipeline Summary"
          echo "Date      : ${{ steps.date.outputs.target_date }}"
          echo "Triggered : ${{ github.event_name }}"
          echo "Run ID    : ${{ github.run_id }}"
          echo "================================"